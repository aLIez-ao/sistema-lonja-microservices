        '429':
          $ref: '#/components/responses/Problema'
        '500':
          $ref: '#/components/responses/Problema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - usuario
                - password
              properties:
                usuario:
                  type: string
                  minLength: 1
                  maxLength: 80
                password:
                  type: string
                  minLength: 1
                  maxLength: 200
              additionalProperties: false
