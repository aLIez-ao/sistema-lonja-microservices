openapi: 3.1.0
info:
  title: Lonja API
  version: 3.0.0
  description: API REST de cuentas, catálogo, tienda, pedidos, ventas y reportes de Lonja. Autenticación Bearer con renovación y errores RFC 9457.
servers:
  - url: /api/v1
paths:
  /salud:
    get:
      operationId: salud
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
        '400':
          $ref: '#/components/responses/Problema'
        '401':
          $ref: '#/components/responses/Problema'
        '403':
