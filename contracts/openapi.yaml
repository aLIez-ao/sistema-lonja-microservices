components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Usuario:
      type: object
      required:
        - id
        - usuario
        - nombre_completo
        - rol
        - correo
        - email_verificado
      properties:
        id:
          type: integer
        usuario:
          type: string
        nombre_completo:
          type: string
        rol:
          type: string
          enum:
            - admin
            - capturista
            - comprador
        correo:
          type:
            - string
            - 'null'
        email_verificado:
          type: boolean
        foto:
          type:
            - string
            - 'null'
        preferencias:
          type:
            - string
            - 'null'
        recibir_avisos:
          type: boolean
        aviso_suscripcion_descartado:
          type: boolean
      additionalProperties: false
    Salud:
      type: object
      required:
        - bd
      properties:
        bd:
          const: ok
        correo:
          description: Estado observado del transporte, sin consultar SMTP por petición. Un fallo temporal no detiene la tienda ni cambia el HTTP 200 si la base está disponible.
          enum: [ok, degradado, simulado, sin-comprobar]
      additionalProperties: false
    Problema:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - errores
        - id
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        errores:
          type: array
          items:
            type: object
        id:
          type: string
      additionalProperties: false
    Sesion:
      type: object
      required:
        - access
        - refresh
        - tipo
        - expira_en
        - usuario
      properties:
        access:
          type: string
        refresh:
          type: string
          pattern: ^[a-f0-9]{64}$
        tipo:
          const: Bearer
        expira_en:
          const: 900
        usuario:
          $ref: '#/components/schemas/Usuario'
      additionalProperties: false
    Dinero:
      type: string
      pattern: ^[0-9]+\.[0-9]{2}$
    Paginacion:
      type: object
      required:
        - pagina
        - tamano
        - total
      properties:
        pagina:
          type: integer
          minimum: 1
        tamano:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      additionalProperties: false
    Yo:
      type: object
      required:
        - datos
      properties:
        datos:
          $ref: '#/components/schemas/Usuario'
      additionalProperties: false
    Objeto:
      type: object
    DatosObjeto:
      type: object
      required:
        - datos
      properties:
        datos:
          $ref: '#/components/schemas/Objeto'
      additionalProperties: false
    Sugerencia:
      type: object
      required:
        - id
        - titulo
        - subtitulo
        - url
      properties:
        id:
          type: integer
        titulo:
          type: string
        subtitulo:
          type: string
        url:
          type: string
      additionalProperties: false
    Sugerencias:
      type: object
      required:
        - datos
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Sugerencia'
      additionalProperties: false
    Lote:
      type: object
      required:
        - id_lte
        - kilos
        - numero_cajas
        - precio_kilo_salida
        - especies
      properties:
        id_lte:
          type: integer
        kilos:
          type:
            - number
            - string
        numero_cajas:
          type: integer
        precio_kilo_salida:
          $ref: '#/components/schemas/Dinero'
        especies:
          type: array
          items:
            $ref: '#/components/schemas/Objeto'
    Tipo:
      type: object
      required:
        - id_tpo
        - nombre
      properties:
        id_tpo:
          type: integer
        nombre:
          type: string
          minLength: 1
          maxLength: 40
        especies:
          type: array
          items:
            type: object
      additionalProperties: false
    Catalogo:
      type: object
      required:
        - id_cat
        - nombre
        - id_tpo
        - activo
      properties:
        id_cat:
          type: integer
        nombre:
          type: string
          maxLength: 40
        id_tpo:
          type: integer
        activo:
          type: boolean
    Especie:
      type: object
      required:
        - id_epe
        - id_lte
        - nombre
        - id_tpo
      properties:
        id_epe:
          type: integer
        id_lte:
          type: integer
        nombre:
          type: string
        id_tpo:
          type: integer
    DatosTipo:
      type: object
      required:
        - datos
      properties:
        datos:
          $ref: '#/components/schemas/Tipo'
      additionalProperties: false
    ListaTipo:
      type: object
      required:
        - datos
        - meta
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Tipo'
        meta:
          $ref: '#/components/schemas/Paginacion'
      additionalProperties: false
    DatosCatalogo:
      type: object
      required:
        - datos
      properties:
        datos:
          $ref: '#/components/schemas/Catalogo'
      additionalProperties: false
    ListaCatalogo:
      type: object
      required:
        - datos
        - meta
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Catalogo'
        meta:
          $ref: '#/components/schemas/Paginacion'
      additionalProperties: false
    DatosEspecie:
      type: object
      required:
        - datos
      properties:
        datos:
          $ref: '#/components/schemas/Especie'
      additionalProperties: false
    ListaEspecie:
      type: object
      required:
        - datos
        - meta
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Especie'
        meta:
          $ref: '#/components/schemas/Paginacion'
      additionalProperties: false
    DatosLote:
      type: object
      required:
        - datos
      properties:
        datos:
          $ref: '#/components/schemas/Lote'
      additionalProperties: false
    ListaLote:
      type: object
      required:
        - datos
        - meta
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Lote'
        meta:
          $ref: '#/components/schemas/Paginacion'
      additionalProperties: false
    Mensaje:
      type: object
      required:
        - mensaje
      properties:
        mensaje:
          type: string
      additionalProperties: false
    Cuenta:
      type: object
      required:
        - us
        - datos
        - direcciones
        - compras
        - total
      properties:
        us:
          type: object
          required:
            - id
            - rol
            - correo
          properties:
            id:
              type: integer
            rol:
              type: string
            correo:
              type:
                - string
                - 'null'
        datos:
          $ref: '#/components/schemas/Objeto'
        comprador:
          type:
            - object
            - 'null'
        direcciones:
          type: array
          items:
            $ref: '#/components/schemas/Objeto'
        compras:
          type: array
          items:
            $ref: '#/components/schemas/Objeto'
        total:
          $ref: '#/components/schemas/Dinero'
    DatosCuenta:
      type: object
      required:
        - datos
      properties:
        datos:
          $ref: '#/components/schemas/Cuenta'
      additionalProperties: false
    Direccion:
      type: object
      required:
        - id_dir
        - id_usuario
        - alias
        - principal
        - cp
        - estado
      properties:
        id_dir:
          type: integer
        id_usuario:
          type: integer
        alias:
          type: string
        principal:
          type: boolean
        cp:
          type: string
          pattern: ^[0-9]{5}$
        estado:
          type: string
    DatosDireccion:
      type: object
      required:
        - datos
      properties:
        datos:
          $ref: '#/components/schemas/Direccion'
      additionalProperties: false
    Direcciones:
      type: object
      required:
        - datos
        - meta
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Direccion'
        meta:
          $ref: '#/components/schemas/Paginacion'
      additionalProperties: false
    ListaUsuarios:
      type: object
      required:
        - datos
        - meta
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Objeto'
        meta:
          $ref: '#/components/schemas/Paginacion'
      additionalProperties: false
    ListaObjetos:
      type: object
      required:
        - datos
        - meta
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Objeto'
        meta:
          $ref: '#/components/schemas/Paginacion'
      additionalProperties: false
    Pedido:
      type: object
      required:
        - id_ped
        - estado
        - subtotal
        - costo_envio
        - total
        - moneda
        - fecha
      properties:
        id_ped:
          type: integer
        estado:
          type: string
          enum:
            - pendiente_pago
            - pagado
            - preparando
            - enviado
            - entregado
            - cancelado
            - expirado
        subtotal:
          $ref: '#/components/schemas/Dinero'
        costo_envio:
          $ref: '#/components/schemas/Dinero'
        total:
          $ref: '#/components/schemas/Dinero'
        moneda:
          const: MXN
        fecha:
          type: string
          format: date-time
    DatosPedido:
      type: object
      required:
        - datos
      properties:
        datos:
          $ref: '#/components/schemas/Pedido'
      additionalProperties: false
  responses:
    Problema:
      description: Error con identificador de correlación
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
