# Alternativa de transición: usar detrás de un terminador TLS de confianza.
# Todas las pantallas ya están migradas; no quedan rutas públicas al monolito.
upstream lonja_api { server 127.0.0.1:2900; }
upstream lonja_cliente { server 127.0.0.1:3000; }
server {
    listen 127.0.0.1:8081;
    server_name _;
    client_max_body_size 450k;
    location /api/ {
        proxy_pass http://lonja_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass http://lonja_cliente;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
